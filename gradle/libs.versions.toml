[versions]
# AGP + tooling (built-in Kotlin support in AGP 9 means no separate kotlin-android plugin).
# Kotlin and KSP must stay on the same minor line (2.3.x); 2.4.x has no KSP release yet.
# AGP is held at 9.3.2 (latest that supports the cached Gradle 9.5.0; 9.4.0 needs Gradle 9.6.0).
agp = "9.3.2"
kotlin = "2.3.21"
spotless = "8.10.2"
ktlint = "1.6.0"
ksp = "2.3.12"
hilt = "2.60.1"
hiltExt = "1.4.0"

# AndroidX / Kotlin libraries
androidDesugarJdkLibs = "2.1.5"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
androidxLifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.1"
composeBom = "2026.09.00"

# Twitch feature stack
media3 = "1.11.1"
okhttp = "5.5.0"
retrofit = "3.0.0"
coil = "3.2.0"
rootencoder = "2.8.1"

# VTuber avatar (face tracking). tasks-vision 1.0.0 exists (2026-07) but its API is unverified here;
# 0.10.35 is the documented FaceLandmarker surface. Bump deliberately, with a device re-verify.
mediapipeTasks = "0.10.35"
camerax = "1.6.2"
filament = "1.76.1"

# Zundamon voice: VOICEVOX CORE Android Java package (vendored, third_party/voicevox); sherpa-onnx is a vendored AAR file.
voicevox = "0.17.0"
sherpaOnnx = "1.13.8"

# Test
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
turbine = "1.2.1"
leakcanary = "2.14"

# Performance (baseline profiles + macrobenchmark)
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"

[libraries]
# --- Build-logic (convention plugin) classpath deps ---
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }

# --- Core AndroidX ---
android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewModelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# --- Compose (BOM-managed) ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-iconsExtended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- Navigation (type-safe Compose Navigation) ---
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# --- VTuber avatar: face tracking (MediaPipe Tasks) + camera frames (CameraX ImageAnalysis) ---
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasks" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
# --- VTuber avatar: rendering the VRM (glTF) with Filament; filament-utils supplies ModelViewer/Manipulator ---
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }
filament-gltfio = { group = "com.google.android.filament", name = "gltfio-android", version.ref = "filament" }
filament-utils = { group = "com.google.android.filament", name = "filament-utils-android", version.ref = "filament" }
# --- Zundamon voice: VOICEVOX CORE text-to-speech (MIT); needs libvoicevox_onnxruntime.so in jniLibs ---
sherpa-onnx = { group = "com.k2fsa.sherpa.onnx", name = "sherpa-onnx", version.ref = "sherpaOnnx" }
voicevox-core-android = { group = "jp.hiroshiba.voicevoxcore", name = "voicevoxcore-android", version.ref = "voicevox" }

# --- Hilt ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewModelCompose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltExt" }

# --- Coroutines / Serialization ---
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# --- Networking (OkHttp + Retrofit + kotlinx.serialization converter) ---
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlin-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

# --- media3 (ExoPlayer + HLS) ---
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# --- Coil (images: thumbnails) ---
coil-kt-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- RootEncoder (camera/mic -> RTMP publishing to Twitch ingest) ---
rootencoder = { group = "com.github.pedroSG94.RootEncoder", name = "library", version.ref = "rootencoder" }

# --- Test ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# --- Baseline profile + macrobenchmark ---
androidx-benchmark-macro = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# Dev-time monitoring: memory-leak detection (debug builds only). Surfaces retained Activities/
# Fragments/Views + heap analysis to logcat, which the ARTEMIS verify pass scans (scripts/leak-scan.sh).
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
# Base plugins (from AGP / Kotlin / KSP / Hilt)
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# com.android.test is on the build-logic AGP classpath, so it is applied without a version.
android-test = { id = "com.android.test" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins (defined in build-logic/)
virtualtwitchdroid-android-application = { id = "virtualtwitchdroid.android.application" }
virtualtwitchdroid-android-application-compose = { id = "virtualtwitchdroid.android.application.compose" }
virtualtwitchdroid-android-library = { id = "virtualtwitchdroid.android.library" }
virtualtwitchdroid-android-library-compose = { id = "virtualtwitchdroid.android.library.compose" }
virtualtwitchdroid-android-feature = { id = "virtualtwitchdroid.android.feature" }
virtualtwitchdroid-hilt = { id = "virtualtwitchdroid.hilt" }
virtualtwitchdroid-jvm-library = { id = "virtualtwitchdroid.jvm.library" }
