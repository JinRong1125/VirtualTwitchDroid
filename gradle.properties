# Project-wide Gradle settings.
# 6 GB: the androidTest DEX merges (mergeExtDex*AndroidTest, in-process R8 workers) ran out of a 4 GB heap once
# :feature:voice's large native AARs joined the build; 4 GB still OOM'd in a fresh JVM, 7 GB passed (2026-09-19).
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled: some AGP 9 / KSP tasks are not yet fully CC-compatible
# across a large module graph. Re-enable once the toolchain is confirmed stable.
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
